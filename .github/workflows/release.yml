# Push a tag like v0.2.0 to publish a release: an archive for every platform
# on the GitHub release, and the Homebrew formula in the tap, so that
#
#   brew install cartercole/tap/kith
#
# installs it. Homebrew downloads the archives without credentials, so the
# release has to be on a public repository. The tag has to match the workspace
# version in Cargo.toml, which is what `kith --version` prints.
#
# Needs a repository secret HOMEBREW_TAP_DEPLOY_KEY: the private half of an
# SSH deploy key with write access to CarterCole/homebrew-tap, and nothing
# else.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo pkgid -p kith-cli | sed 's/.*[#@]//')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }

      - name: Check the JS and Python packages match the tag
        run: |
          js=$(node -p "require('./packages/js/package.json').version")
          py=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/python/pyproject.toml | head -1)
          test "v$js" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but packages/js/package.json says $js"; exit 1; }
          test "v$py" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but packages/python/pyproject.toml says $py"; exit 1; }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --workspace --locked

  # Rust cross-compiles between macOS and Linux only with pain, so each target
  # is built on its own machine.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-15 }
          - { target: x86_64-apple-darwin,       os: macos-15 }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: packaging/archive.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/release/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/release
          merge-multiple: true

      - name: Checksums and the Homebrew formula
        run: |
          (cd dist/release && shasum -a 256 *.tar.gz > checksums.txt)
          KITH_REPO="$GITHUB_REPOSITORY" packaging/homebrew/formula.sh "${GITHUB_REF_NAME#v}" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" dist/release \
            > dist/release/kith.rb

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/release/*.tar.gz dist/release/checksums.txt

      - name: Update the Homebrew tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAP: CarterCole/homebrew-tap
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:$TAP.git" tap
          mkdir -p tap/Formula
          cp dist/release/kith.rb tap/Formula/kith.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kith.rb
          git commit -m "kith ${GITHUB_REF_NAME#v}"
          git push
