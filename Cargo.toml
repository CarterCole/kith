[workspace]
resolver = "2"
members = ["crates/kith-core", "crates/kith-hub", "crates/kith-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
kith-core = { path = "crates/kith-core" }
kith-hub = { path = "crates/kith-hub" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
data-encoding = "2"
bs58 = "0.5"
sha2 = "0.10"
sha3 = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
k256 = { version = "0.13", features = ["ecdsa"] }
cedar-policy = "4.13"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
clap = { version = "4", features = ["derive", "env"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }

# RSA key generation is painfully slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
