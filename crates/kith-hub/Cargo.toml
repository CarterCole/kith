[package]
name = "kith-hub"
description = "Reference Kith hub: KEL registry, authentication, token exchange and OpenID Connect provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kith-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
sha2.workspace = true
rand.workspace = true
hmac = "0.12"
base64.workspace = true
rsa = { version = "0.9", features = ["sha2"] }
aes-gcm = "0.10"
p256 = { workspace = true, features = ["ecdh"] }
reqwest.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# Sending verification codes through Amazon SES and AWS End User Messaging SMS.
aws-config = { version = "1.13", optional = true, features = ["behavior-version-latest"] }
aws-sdk-sesv2 = { version = "1", optional = true }
aws-sdk-pinpointsmsvoicev2 = { version = "1", optional = true }

[features]
aws = ["dep:aws-config", "dep:aws-sdk-sesv2", "dep:aws-sdk-pinpointsmsvoicev2"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
