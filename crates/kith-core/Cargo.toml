[package]
name = "kith-core"
description = "Kith protocol core: identities, key event logs, session chains, tokens and authorization"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
data-encoding.workspace = true
bs58.workspace = true
sha2.workspace = true
sha3.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
p256.workspace = true
k256.workspace = true
cedar-policy.workspace = true
hmac = "0.12"
sha1 = "0.10"
skip_ratchet = { version = "0.3", features = ["serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
bls12_381 = { version = "0.9", default-features = false, features = ["groups", "pairings", "experimental"] }
rsa = { version = "0.9", features = ["sha2"] }
ripemd = "0.1"
