[package]
name = "kith-cli"
description = "The kith command line"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kith"
path = "src/main.rs"

[features]
# Send verification codes through Amazon SES and AWS End User Messaging SMS.
aws = ["kith-hub/aws"]

[dependencies]
kith-core.workspace = true
kith-hub.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
reqwest.workspace = true
clap.workspace = true
rand.workspace = true
hickory-resolver.workspace = true
# `kith passkey enroll --qr` and `kith device join` print QR codes.
qrcode = { version = "0.14", default-features = false }
# `kith bundle edit` serves its page on loopback.
axum.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Reads back the QR codes the CLI prints.
rqrr = { version = "0.11", default-features = false }

# The macOS keychain and Secure Enclave backends (`keystore.rs`). Other platforms
# fall back to the plaintext file backend.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false, features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17", default-features = false, features = ["OSX_10_15"] }
core-foundation = "0.10"
p256.workspace = true

